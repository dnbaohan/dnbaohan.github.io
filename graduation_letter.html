<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6">
  <title>Một lá thư nhỏ — Graduation</title>
  <style>
    :root {
      --paper: #faf9f6;
      --ink: #70202f;
      --rose: #a96f7d;
      --muted: #9b8588;
      --ease: cubic-bezier(.2,.72,.18,1);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background-image: none;
    }
    #heart-rain { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .falling-heart {
      position: absolute;
      top: -12vh;
      left: var(--left);
      font-size: var(--size);
      opacity: 0;
      line-height: 1;
      filter: drop-shadow(0 3px 5px rgba(110, 42, 57, .10));
      will-change: transform, opacity;
      animation: heart-fall var(--duration) var(--delay) linear infinite;
      user-select: none;
    }
    @keyframes heart-fall {
      0% { transform: translate3d(0,-3vh,0) rotate(-18deg); opacity: 0; }
      8% { opacity: var(--alpha); }
      88% { opacity: var(--alpha); }
      100% { transform: translate3d(var(--drift),112vh,0) rotate(340deg); opacity: 0; }
    }
    main {
      min-height: 100svh;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(28px, 5vh, 56px) 18px 22px;
      isolation: isolate;
    }
    .intro { text-align: center; position: relative; z-index: 3; }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 10px;
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: #a17c82;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(27px, 4vw, 43px);
      letter-spacing: .015em;
      color: #742636;
    }
    .subtitle {
      margin: 11px 0 0;
      color: #987e83;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(13px, 1.6vw, 16px);
      font-style: italic;
      letter-spacing: .025em;
    }
    .stage {
      position: relative;
      width: min(1120px, 100%);
      flex: 1 1 auto;
      min-height: min(650px, 68vh);
      display: grid;
      place-items: center;
      margin: 8px auto 4px;
    }
    .closed-letter {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -47%);
      width: min(275px, 76vw);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .48s ease, transform .75s var(--ease), filter .4s ease;
      animation: letter-float 5.4s ease-in-out infinite;
      outline-offset: 12px;
    }
    .closed-letter img { display: block; width: 100%; height: auto; filter: drop-shadow(0 18px 26px rgba(92,43,54,.12)); }
    .closed-letter:hover { filter: brightness(1.025); }
    .closed-letter:focus-visible { outline: 2px solid #a96f7d; border-radius: 12px; }
    .tap-hint {
      display: block;
      margin-top: 12px;
      color: #9d7b82;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      animation: hint-pulse 2.4s ease-in-out infinite;
    }
    @keyframes letter-float { 0%,100% { transform: translate(-50%,-47%) translateY(0); } 50% { transform: translate(-50%,-47%) translateY(-10px); } }
    @keyframes hint-pulse { 0%,100% { opacity: .56; } 50% { opacity: 1; } }

    .open-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 5vw, 66px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .55s ease, visibility .55s;
      perspective: 1400px;
    }
    .opened-envelope {
      position: absolute;
      z-index: 0;
      left: 50%; top: 54%;
      width: min(490px, 45vw);
      height: auto;
      transform: translate(-50%,-50%) rotate(-3deg) scale(.82);
      opacity: 0;
      filter: drop-shadow(0 18px 22px rgba(90,42,52,.10));
    }
    .photo-card {
      position: relative;
      z-index: 2;
      flex: 0 1 340px;
      width: min(340px, 29vw);
      max-height: 73vh;
      margin: 0;
      padding: 9px 9px 12px;
      overflow: hidden;
      background: rgba(255,255,252,.97);
      border: 1px solid rgba(112,32,47,.10);
      box-shadow: 0 24px 58px rgba(87,42,52,.17), 0 3px 9px rgba(87,42,52,.08);
      opacity: 0;
      transform-style: preserve-3d;
      pointer-events: auto;
      cursor: zoom-in;
      transition: box-shadow .35s ease, filter .35s ease;
    }
    .photo-card img {
      display: block;
      width: 100%;
      max-height: calc(73vh - 22px);
      height: auto;
      object-fit: contain;
      background: #fff;
    }
    .invite-card { transform: translateY(100px) rotate(-5deg) scale(.78); }
    .memory-card { transform: translateY(100px) rotate(5deg) scale(.78); }
    .photo-card:hover { box-shadow: 0 30px 70px rgba(87,42,52,.23), 0 4px 13px rgba(87,42,52,.10); filter: saturate(1.04); }
    .scene-note {
      position: absolute;
      left: 50%; bottom: 2px;
      transform: translateX(-50%) translateY(12px);
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-style: italic;
      letter-spacing: .04em;
      color: #977a80;
      opacity: 0;
    }
    .is-open .closed-letter {
      opacity: 0;
      pointer-events: none;
      animation: none;
      transform: translate(-50%, -54%) scale(.78) rotate(-5deg);
    }
    .is-open .open-scene { opacity: 1; visibility: visible; pointer-events: auto; }
    .is-open .opened-envelope { animation: envelope-arrive .95s .08s var(--ease) forwards; }
    .is-open .invite-card { animation: card-left .95s .26s var(--ease) forwards; }
    .is-open .memory-card { animation: card-right 1s .42s var(--ease) forwards; }
    .is-open .scene-note { animation: note-arrive .65s 1.05s ease forwards; }
    @keyframes envelope-arrive {
      0% { opacity: 0; transform: translate(-50%,-42%) rotate(-9deg) scale(.72); }
      100% { opacity: .94; transform: translate(-50%,-50%) rotate(-3deg) scale(1); }
    }
    @keyframes card-left {
      0% { opacity: 0; transform: translate(35px,115px) rotate(-13deg) scale(.76); }
      72% { opacity: 1; transform: translate(-8px,-12px) rotate(-7deg) scale(1.025); }
      100% { opacity: 1; transform: translateY(-5px) rotate(-4deg) scale(1); }
    }
    @keyframes card-right {
      0% { opacity: 0; transform: translate(-35px,120px) rotate(13deg) scale(.76); }
      72% { opacity: 1; transform: translate(8px,-14px) rotate(7deg) scale(1.025); }
      100% { opacity: 1; transform: translateY(7px) rotate(4deg) scale(1); }
    }
    @keyframes note-arrive { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .bottom-line {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 4;
      color: #a2868b;
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .replay {
      border: 1px solid rgba(112,32,47,.22);
      color: #7b3442;
      background: rgba(255,255,255,.62);
      border-radius: 999px;
      padding: 9px 15px;
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(5px);
      transition: opacity .3s ease, transform .3s ease, background .3s ease;
    }
    .replay:hover { background: white; }
    .is-open .replay { opacity: 1; visibility: visible; transform: translateY(0); }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(35,18,23,.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .28s ease, visibility .28s ease;
      cursor: zoom-out;
    }
    .lightbox.show { opacity: 1; visibility: visible; }
    .lightbox img {
      display: block;
      max-width: min(88vw, 720px);
      max-height: 88svh;
      width: auto;
      height: auto;
      object-fit: contain;
      padding: 10px;
      background: #fffefa;
      box-shadow: 0 30px 90px rgba(0,0,0,.28);
      transform: translateY(14px) scale(.97);
      transition: transform .4s var(--ease);
    }
    .lightbox.show img { transform: translateY(0) scale(1); }
    .close-lightbox {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      width: 42px; height: 42px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      color: white;
      background: rgba(255,255,255,.12);
      font-size: 23px;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      main { padding: max(28px, env(safe-area-inset-top)) 10px max(16px, env(safe-area-inset-bottom)); }
      .eyebrow { font-size: 8px; letter-spacing: .27em; }
      .subtitle { margin-top: 8px; }
      .stage { min-height: 66svh; width: 100%; }
      .closed-letter { width: min(275px, 76vw); }
      .open-scene { gap: clamp(10px, 3vw, 18px); padding: 0 3px; }
      .opened-envelope { width: min(84vw, 390px); top: 51%; }
      .photo-card { flex: 0 1 calc(50% - 8px); width: calc(50% - 8px); max-height: 58svh; padding: 5px 5px 7px; }
      .photo-card img { max-height: calc(58svh - 12px); }
      .invite-card { transform: translateY(90px) rotate(-5deg) scale(.78); }
      .memory-card { transform: translateY(90px) rotate(5deg) scale(.78); }
      @keyframes card-left {
        0% { opacity: 0; transform: translate(16px,90px) rotate(-13deg) scale(.76); }
        72% { opacity: 1; transform: translate(-2px,-9px) rotate(-6deg) scale(1.02); }
        100% { opacity: 1; transform: translateY(-4px) rotate(-3deg) scale(1); }
      }
      @keyframes card-right {
        0% { opacity: 0; transform: translate(-16px,90px) rotate(13deg) scale(.76); }
        72% { opacity: 1; transform: translate(2px,-9px) rotate(6deg) scale(1.02); }
        100% { opacity: 1; transform: translateY(5px) rotate(3deg) scale(1); }
      }
      .scene-note { bottom: 6px; font-size: 11px; }
      .bottom-line { font-size: 8px; letter-spacing: .15em; gap: 8px; }
      .replay { padding: 8px 12px; font-size: 8px; }
    }
    @media (max-height: 680px) and (min-width: 641px) {
      main { padding-top: 20px; padding-bottom: 12px; }
      .stage { min-height: 58vh; }
      .photo-card { width: min(260px, 24vw); }
      .photo-card img { max-height: 61vh; }
      .opened-envelope { width: min(390px, 38vw); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .falling-heart { display: none; }
    }
  </style>
</head>

    </section>

    <footer class="bottom-line">
      <span>With love</span>
      <span aria-hidden="true">·</span>
      <span>♡</span>
      <button class="replay" id="replay" type="button">Đóng thư &amp; xem lại</button>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh lớn">
    <button class="close-lightbox" id="closeLightbox" type="button" aria-label="Đóng">×</button>
    <img id="lightboxImage" alt="Ảnh phóng to">
  </div>

  <script>
    (() => {
      const page = document.getElementById('page');
      const openButton = document.getElementById('openLetter');
      const scene = document.getElementById('openScene');
      const replay = document.getElementById('replay');
      const rain = document.getElementById('heart-rain');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const closeLightbox = document.getElementById('closeLightbox');
      const hearts = ['🩷','💛','💚','💙','🩵','💜','🩶','🖤','🤍','🧡'];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!reducedMotion) {
        const count = window.innerWidth < 600 ? 19 : 30;
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('span');
          const duration = 10 + Math.random() * 13;
          heart.className = 'falling-heart';
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.setProperty('--left', `${Math.random() * 100}%`);
          heart.style.setProperty('--size', `${12 + Math.random() * 15}px`);
          heart.style.setProperty('--duration', `${duration}s`);
          heart.style.setProperty('--delay', `${-Math.random() * duration}s`);
          heart.style.setProperty('--drift', `${Math.round((Math.random() - .5) * 150)}px`);
          heart.style.setProperty('--alpha', `${.34 + Math.random() * .38}`);
          rain.appendChild(heart);
        }
      }

      function openLetter() {
        page.classList.add('is-open');
        scene.setAttribute('aria-hidden', 'false');
        openButton.setAttribute('aria-expanded', 'true');
      }
      function closeLetter() {
        page.classList.remove('is-open');
        scene.setAttribute('aria-hidden', 'true');
        openButton.setAttribute('aria-expanded', 'false');
      }
      openButton.addEventListener('click', openLetter);
      replay.addEventListener('click', closeLetter);

      function showImage(src, alt) {
        lightboxImage.src = src;
        lightboxImage.alt = alt;
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
        closeLightbox.focus();
      }
      function hideImage() {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
        lightboxImage.removeAttribute('src');
      }
      document.querySelectorAll('.photo-card').forEach(card => {
        card.addEventListener('click', () => {
          const img = card.querySelector('img');
          showImage(img.src, img.alt);
        });
      });
      closeLightbox.addEventListener('click', hideImage);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) hideImage();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hideImage();
        if ((event.key === 'Enter' || event.key === ' ') && document.activeElement === openButton) {
          event.preventDefault(); openLetter();
        }
      });
    })();
  </script>
