<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư mời tốt nghiệp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --wine:#7a1426;
  --ew:min(78vw,420px);
  --cw:min(45vw,47vh,440px);
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{background:radial-gradient(ellipse at 50% 42%,#fffefd 0%,var(--bg) 55%,#f4efea 100%);
  font-family:"Cormorant Garamond",Georgia,serif;-webkit-tap-highlight-color:transparent}

/* hearts */
.rain{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fall{position:absolute;top:-60px;left:0;font-size:clamp(24px,2.2vw,30px);will-change:transform;animation:fall 12s linear infinite}
.sway{display:block;line-height:1}
@keyframes fall{to{transform:translate3d(0,calc(100vh + 120px),0)}}

/* stage */
.stage{position:fixed;inset:0;z-index:2}
.env{position:absolute;left:50%;top:50%;width:var(--ew);height:calc(var(--ew) * 0.7613);
  margin:calc(var(--ew) * -.5) 0 0 calc(var(--ew) * -.5);margin-top:calc(var(--ew) * -.38);
  cursor:pointer;outline:none;will-change:transform,opacity;
  transition:transform .9s var(--ease-out) .45s,opacity .6s ease .45s}
.bob{position:absolute;inset:0;animation:bob 4.2s ease-in-out infinite}
.env-in{position:absolute;inset:0;transition:transform .45s var(--ease-out)}
.env:hover .env-in{transform:translateY(-4px) scale(1.025)}
.env:active .env-in{transform:scale(.955)}
.env:focus-visible .env-in{filter:drop-shadow(0 0 0 var(--wine)) drop-shadow(0 0 6px var(--wine))}
.env img{position:absolute;left:0;bottom:0;width:100%;display:block;
  filter:drop-shadow(0 22px 26px rgba(95,25,45,.22));user-select:none;-webkit-user-drag:none}
.env .closed{height:100%;transition:opacity .4s ease}
.env .opened{height:auto;aspect-ratio:1/1.3838;opacity:0;transform:translateY(5%) scale(.96);
  transform-origin:50% 100%;transition:opacity .35s ease,transform .6s var(--ease-out)}
@keyframes bob{50%{transform:translateY(-7px)}}

.intro{position:absolute;left:0;right:0;top:calc(max(env(safe-area-inset-top),0px) + clamp(20px,4.5vh,44px));
  padding:0 20px;text-align:center;color:var(--wine);pointer-events:none;animation:in 1.2s ease .15s backwards;transition:opacity .5s ease}
.intro h1{font:italic 500 clamp(25px,6.2vw,38px)/1.12 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em}
.intro p{font:italic 500 clamp(16px,4.1vw,20px)/1.3 "Cormorant Garamond",Georgia,serif;letter-spacing:.03em;color:#93384c}
.intro h1,.intro p{text-wrap:balance}
.intro h1+p{margin-top:12px;max-width:34em;margin-inline:auto}
.intro p+p{margin-top:2px;color:#a85a6c}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.hint{position:absolute;left:0;right:0;top:calc(50% + var(--ew) * .38 + 30px);text-align:center;
  font-style:italic;font-weight:500;font-size:clamp(17px,4.4vw,22px);letter-spacing:.04em;color:var(--wine);
  transition:opacity .4s ease;pointer-events:none}

.card{position:absolute;left:50%;top:var(--cy,50%);width:var(--cw);aspect-ratio:1/1.4097;
  margin:calc(var(--cw) * -.7048) 0 0 calc(var(--cw) * -.5);
  border-radius:8px;overflow:hidden;background:#fff;opacity:0;pointer-events:none;will-change:transform,opacity;
  box-shadow:0 34px 60px -22px rgba(100,15,35,.42),0 8px 22px rgba(60,20,30,.1);
  transition:transform .7s cubic-bezier(.55,0,.8,.3),opacity .3s ease .4s}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.c1{transform:translate(0,calc(50vh - var(--cy,50vh))) scale(.2) rotate(-9deg)}
.c2{transform:translate(0,calc(50vh - var(--cy,50vh))) scale(.2) rotate(9deg)}

.back{z-index:10;position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
  font:italic 500 18px "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:var(--wine);
  background:rgba(255,255,255,.7);border:1px solid rgba(122,20,38,.35);border-radius:99px;padding:8px 22px;
  cursor:pointer;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s,background .3s}
.back:hover{background:#fff}

/* zoom (after the cards have settled) */
.open.settled .card{pointer-events:auto;cursor:zoom-in;outline:none;
  transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .5s ease,box-shadow .6s ease}
.open.settled .card:focus-visible{box-shadow:0 0 0 3px var(--wine),0 34px 60px -22px rgba(100,15,35,.42)}
.zoomed .intro{opacity:0}
/* opened state */
.open .bob{animation-play-state:paused}
.open .env{pointer-events:none;transform:translateY(46vh) scale(.88);opacity:0;
  transition:transform .9s cubic-bezier(.65,0,.35,1) .7s,opacity .6s ease .8s}
.open .closed{opacity:0}
.open .opened{opacity:1;transform:none}
.open .hint{opacity:0}
.open .card{opacity:1;transition:transform 1.05s cubic-bezier(.2,1.12,.3,1) .6s,opacity .3s ease .6s}
.open .c1{transform:translate(-54%,0) scale(1) rotate(0)}
.open .c2{transform:translate(54%,0) scale(1) rotate(0);transition-delay:.67s,.67s}
.open .back{opacity:1;visibility:visible;transition:opacity .5s ease 1.7s,visibility 0s 1.7s,background .3s}

.z1 .c1,.z2 .c2{z-index:5;cursor:zoom-out;transform:translate(0,var(--zy)) scale(var(--z)) rotate(0);
  box-shadow:0 56px 96px -34px rgba(100,15,35,.55),0 12px 32px rgba(60,20,30,.14)}
.z1 .c2{transform:translate(var(--ox),var(--zy)) scale(var(--s)) rotate(0);opacity:.55}
.z2 .c1{transform:translate(calc(var(--ox) * -1),var(--zy)) scale(var(--s)) rotate(0);opacity:.55}
.z1 .c2:hover,.z2 .c1:hover{opacity:.85}
@media (prefers-reduced-motion:reduce){
  .rain{display:none}.bob,.intro{animation:none}
  .env,.card,.opened,.closed{transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA <script>
(function(){
  var icons=["🍭", "🧋", "🥑", "🍓", "🫐", "🥝", "🍄", "🍏", "🌰", "🍅", "🪾", "🍋‍🟩", "🥭", "🍒", "🥬", "🍎", "🍌", "🧄", "🫚", "🫛", "🎯", "🧸", "🪆", "🎶", "🎤", "💻", "📽️", "📸", "🍦", "🍫", "🍵", "🪺", "🪹", "🌱", "🌼", "🌺", "🌻", "🌷", "🏵️", "🌸", "🚩", "✈️", "🪂", "🫧", "🌟", "🌈", "❄️", "☄️", "🌊", "💤", "💫", "💞", "⛰️", "🥇", "🐳", "🦞", "🪸", "🕊️", "🦢", "🦩", "🐥", "🦋", "🐍", "🐉", "🐏", "🐐", "🐾", "🦄", "🐷", "🐰", "🐭", "🦁", "🐨", "🐹", "🐮", "🐂", "🦥", "🦈", "🦭", "🐟", "🦐", "🦀", "🪼"];
  var rain=document.getElementById("rain"),rnd=function(a,b){return a+Math.random()*(b-a)};
  var n=innerWidth<600?20:32,D=12,items=[],xs=[];
  /* best-candidate placement: icons close in height are pushed far apart horizontally */
  function place(i){
    var travel=innerHeight+120,best=-1,bx=0;
    for(var k=0;k<24;k++){
      var x=rnd(0,Math.max(innerWidth-36,10)),sc=1e9;
      for(var j=0;j<n;j++){
        if(j===i||xs[j]===undefined)continue;
        var p=Math.abs(i-j)/n;p=Math.min(p,1-p);
        sc=Math.min(sc,Math.hypot(x-xs[j],p*travel));
      }
      if(sc>best){best=sc;bx=x}
    }
    xs[i]=bx;items[i].style.left=(bx/innerWidth*100)+"vw";
  }
  /* new icon that is not on screen right now (so also never the same as its own previous one) */
  function pick(){
    var used={};
    items.forEach(function(e){used[e.firstChild.firstChild.nodeValue]=1});
    var pool=icons.filter(function(c){return !used[c]});
    return pool[Math.floor(Math.random()*pool.length)];
  }
  for(var i=0;i<n;i++){
    var f=document.createElement("div");f.className="fall";
    var s=document.createElement("span");s.className="sway";s.textContent="\u2022";
    f.appendChild(s);f.style.animationDelay=-(i/n*D)+"s";f._i=i;
    items.push(f);rain.appendChild(f);
    f.addEventListener("animationiteration",function(e){
      if(e.target===this){place(this._i);this.firstChild.firstChild.nodeValue=pick()}
    });
  }
  items.forEach(function(f){place(f._i);f.firstChild.firstChild.nodeValue=pick()});

  var intro=document.querySelector(".intro");
  function layout(){
    var top=intro.offsetTop+intro.offsetHeight+18,
        avail=Math.max(innerHeight-top-78,160),
        cw=Math.max(Math.min(innerWidth*.45,avail/1.4097,440),110);
    stage.style.setProperty("--cw",cw+"px");
    stage.style.setProperty("--cy",(top+avail/2)+"px");
    var z=Math.max(1,Math.min((innerHeight-130)/(cw*1.4097),innerWidth*.94/cw,2.4)),sw=cw*.5;
    stage.style.setProperty("--z",z);
    stage.style.setProperty("--s",.5);
    stage.style.setProperty("--ox",Math.min(cw*z/2+sw/2+20,innerWidth/2-sw/2-6)+"px");
    stage.style.setProperty("--zy",(innerHeight/2-(top+avail/2))+"px");
  }
  var stage=document.getElementById("stage");
  layout();addEventListener("resize",layout);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  var _s=document.getElementById("stage"),env=document.getElementById("env");
  var cards=stage.querySelectorAll(".card"),zoom=0,tm;
  function setZoom(k){
    stage.classList.remove("z1","z2","zoomed");
    if(k)stage.classList.add("z"+k,"zoomed");
    zoom=k;
  }
  function settle(on){
    stage.classList.toggle("settled",on);
    Array.prototype.forEach.call(cards,function(c){c.tabIndex=on?0:-1});
  }
  function toggle(open){
    clearTimeout(tm);setZoom(0);settle(false);
    stage.classList.toggle("open",open);
    env.setAttribute("aria-expanded",open);
    if(open)tm=setTimeout(function(){settle(true)},1800);
  }
  Array.prototype.forEach.call(cards,function(c,i){
    function go(){if(stage.classList.contains("settled"))setZoom(zoom===i+1?0:i+1)}
    c.addEventListener("click",go);
    c.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
  stage.addEventListener("click",function(e){if(e.target===stage&&zoom)setZoom(0)});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&zoom)setZoom(0)});
  env.addEventListener("click",function(){toggle(true)});
  env.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(true)}});
  document.getElementById("back").addEventListener("click",function(){toggle(false)});
})();
</script>
