<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp mời Lễ Tốt Nghiệp – Phúc Trương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#7a0303; --wine-deep:#4a0000; --wine-ink:#2a0202;
  --cream:#fff6f2; --stripe:#c9b4b4; --stage:#1a0606;
  --font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 38%,#3a0b0b 0%,var(--stage) 62%,#0d0303 100%);
  font-family:var(--font); color:var(--cream);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);
  overflow:hidden;
}
.stage{perspective:2400px}
.book{
  position:relative;
  width:min(92vw,calc(80vh * 924 / 1302),560px);
  width:min(92vw,calc(80dvh * 924 / 1302),560px);
  aspect-ratio:827/1169;
  container-type:inline-size;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));
  transition:transform 1.2s cubic-bezier(.6,.05,.2,1);
}
.page,.cover,.face{position:absolute;inset:0}
.page{background:var(--wine-deep);overflow:hidden;border-radius:6px}
.page svg,.face svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,0) 65%);transition:opacity 1.3s ease;pointer-events:none}
.book.open .shade{opacity:0}

.art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
.call{position:absolute;left:37%;top:67.6%;width:26%;height:4.2%}
/* chữ trang trong */
.copy{
  position:absolute; left:0; right:0; top:25%; text-align:center;
  display:flex; flex-direction:column; align-items:center;
  padding:0 14cqw;
}
.ln{opacity:0;transform:translateY(1.6cqw);transition:opacity .7s ease,transform .7s ease}
.book.open .ln{opacity:1;transform:none;transition-delay:calc(.8s + var(--i) * .1s)}
.k{font-weight:700;font-size:6.2cqw;letter-spacing:.01em;transform-origin:left center;display:inline-block;rotate:-6deg;margin-bottom:.4cqw;margin-right:12cqw}
.k.ln{rotate:-6deg}
.big{font-weight:700;font-size:4.5cqw;line-height:1.2}
.thin{font-weight:300;font-size:2.75cqw;line-height:1.5}
.mid{font-weight:700;font-size:3.5cqw;line-height:1.25}
.name{font-weight:600;font-size:10.4cqw;line-height:1;letter-spacing:.01em;white-space:nowrap;margin:1.8cqw 0 3.6cqw}
.name.ln{transition-duration:1s}
.phone{display:inline-flex;align-items:center;gap:1.6cqw;margin-top:2.6cqw;font-weight:600;font-size:3.3cqw;color:var(--cream);text-decoration:none}
.phone i{width:5.6cqw;height:5.6cqw;border-radius:50%;background:#fff;display:grid;place-items:center}
.phone svg{position:static;width:3.2cqw;height:3.2cqw}
.gap1{margin-bottom:2.4cqw}.gap2{margin-bottom:3.4cqw}

/* bìa */
.cover{
  transform-origin:left center; transform-style:preserve-3d;
  transition:transform 1.4s cubic-bezier(.62,.04,.2,1),opacity .3s ease;
  cursor:pointer; outline:none; border-radius:6px;
}
.book:not(.open) .cover:hover,.book:not(.open) .cover:focus-visible{transform:rotateY(-7deg)}
.cover:focus-visible .front{box-shadow:0 0 0 3px #ffd9d3}
.book.open .cover{transform:rotateY(-174deg);opacity:0;pointer-events:none;
  transition:transform 1.4s cubic-bezier(.62,.04,.2,1),opacity .45s ease 1.05s}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:6px}
.front{background:#fff}
.back{transform:rotateY(180deg);background:var(--wine-deep)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 8%,rgba(255,255,255,0) 90%,rgba(0,0,0,.1));pointer-events:none}
.title{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  font-weight:700; font-size:7.6cqw; line-height:1.55; letter-spacing:.08em; color:#fff;
}

/* thanh dưới */
.bar{height:44px;display:grid;place-items:center}
.hint{font-weight:300;font-size:.95rem;letter-spacing:.04em;color:#e9cfc9;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.again{
  font:600 .9rem var(--font);color:var(--cream);background:transparent;cursor:pointer;
  border:1px solid rgba(255,230,225,.45);border-radius:99px;padding:10px 22px;
  transition:background .25s,border-color .25s;
}
.again:hover{background:rgba(255,255,255,.1);border-color:#fff}
.again:focus-visible{outline:2px solid #ffd9d3;outline-offset:3px}
.bar .hint,.bar .again{grid-area:1/1}
.again{opacity:0;pointer-events:none;transition:opacity .5s ease,background .25s,border-color .25s}
.book-open .again{opacity:1;pointer-events:auto;transition-delay:1.6s,0s,0s}
.book-open .hint{display:none}

@media (prefers-reduced-motion:reduce){
  .cover,.ln,.shade,.hint,.again{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}
</style>
</head>

  <span class="hint">Chạm vào thiệp để mở</span>
  <button class="again" id="again" type="button">Gập thiệp lại</button>

<script>
(function(){
  var book=document.getElementById('book'),
      cover=document.getElementById('cover'),
      bar=document.getElementById('bar'),
      again=document.getElementById('again');
  function setOpen(v){
    book.classList.toggle('open',v);
    document.body.classList.toggle('book-open',v);
    bar.classList.toggle('book-open',v);
    cover.setAttribute('aria-expanded',v?'true':'false');
    cover.tabIndex=v?-1:0;
    if(!v) cover.focus({preventScroll:true});
  }
  cover.addEventListener('click',function(){setOpen(true)});
  cover.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(true)}
  });
  again.addEventListener('click',function(){setOpen(false)});
})();
</script>
